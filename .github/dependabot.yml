# Keeps the pinned toolchain current: Astro, its type checker, TypeScript and
# Wrangler. Workers Builds installs whatever package.json pins, so a bump here
# is what moves the build and deploy tooling.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Wait a week after a release before proposing it: most broken or
    # hijacked releases are found and pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tooling:
        patterns:
          - "typescript"
          - "wrangler"
